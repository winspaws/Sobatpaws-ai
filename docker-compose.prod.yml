# =============================================================================
#  Sobatpaws — Production Stack (Docker Compose)
#  Includes: API service, PostgreSQL, pgAdmin
#
#  Usage:
#    docker compose up -d                     # Start stack
#    docker compose logs -f api               # Tail API logs
#    docker compose exec api curl localhost:8000/health  # Health check
#    docker compose down                      # Stop (keep volumes)
#    docker compose down -v                   # Stop + DELETE data (reset)
#
#  Prerequisites:
#    1. Copy .env.production → .env and fill in secrets
#    2. Ensure ML models exist in artifacts/models/
#    3. docker compose build api   (first time / after code changes)
# =============================================================================

services:

  # ── API Service ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sobatpaws-api:latest
    container_name: sobatpaws-api
    restart: unless-stopped

    ports:
      - "8080:8000"

    environment:
      # Database — connect to the 'postgres' service in this stack
      DATABASE_URL: postgresql://sobatpaws:${POSTGRES_PASSWORD:-sobatpaws_dev}@postgres:5432/sobatpaws

      # AI Provider (set via .env)
      SOBATPAWS_AI_PROVIDER: ${SOBATPAWS_AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-ollama}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.2}

      # AI tuning
      SOBATPAWS_AI_TEMPERATURE: ${SOBATPAWS_AI_TEMPERATURE:-0.2}
      SOBATPAWS_AI_MAX_TOKENS: ${SOBATPAWS_AI_MAX_TOKENS:-800}
      SOBATPAWS_AI_AUGMENTATION_MODE: ${SOBATPAWS_AI_AUGMENTATION_MODE:-smart}
      SOBATPAWS_AI_DAILY_TOKEN_BUDGET: ${SOBATPAWS_AI_DAILY_TOKEN_BUDGET:-0}
      SOBATPAWS_AI_CACHE_TTL_SEC: ${SOBATPAWS_AI_CACHE_TTL_SEC:-3600}
      SOBATPAWS_AI_SKIP_LLM_CONFIDENCE: ${SOBATPAWS_AI_SKIP_LLM_CONFIDENCE:-0.82}
      SOBATPAWS_AI_FALLBACK_CHAIN: ${SOBATPAWS_AI_FALLBACK_CHAIN:-local,openai,anthropic}

      # Storage backends
      SOBATPAWS_LEARNING_BACKEND: ${SOBATPAWS_LEARNING_BACKEND:-jsonl}
      SOBATPAWS_AI_STORE_BACKEND: ${SOBATPAWS_AI_STORE_BACKEND:-jsonl}
      SOBATPAWS_SESSION_BACKEND: ${SOBATPAWS_SESSION_BACKEND:-jsonl}

      # Auth keys (set via .env)
      SOBATPAWS_VET_API_KEY: ${SOBATPAWS_VET_API_KEY:-}
      SOBATPAWS_ADMIN_API_KEY: ${SOBATPAWS_ADMIN_API_KEY:-}

    volumes:
      # Mount ML models and learning data for persistence
      - sobatpaws_artifacts:/app/artifacts

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

    # Resource limits — ML inference (RandomForest) is CPU-bound
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    # Graceful shutdown
    stop_grace_period: 30s

    networks:
      - sobatpaws-network

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sobatpaws-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: sobatpaws
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sobatpaws_dev}
      POSTGRES_DB: sobatpaws
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=en_US.UTF8"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sobatpaws -d sobatpaws"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

    networks:
      - sobatpaws-network

  # ── pgAdmin (optional — remove in production if not needed) ──────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sobatpaws-pgadmin
    restart: unless-stopped
    profiles:
      - debug  # Only starts with: docker compose --profile debug up -d

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sobatpaws.id}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    deploy:
      resources:
        limits:
          memory: 256M

    networks:
      - sobatpaws-network

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  sobatpaws_artifacts:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  sobatpaws-network:
    name: sobatpaws-network
    driver: bridge
