# Sobatpaws — Backend AI Services
# Docker Compose untuk production deployment
#
# Usage:
#   docker compose up -d              # Start services
#   docker compose logs -f            # Follow logs
#   docker compose down               # Stop services
#
# Environment variables:
#   Copy .env.example to .env and adjust

services:
  api:
    build: .
    container_name: sobatpaws-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      # Defaults (overridden by .env if set)
      - SOBATPAWS_AI_PROVIDER=${SOBATPAWS_AI_PROVIDER:-local}
      - SOBATPAWS_AI_AUGMENTATION_MODE=${SOBATPAWS_AI_AUGMENTATION_MODE:-smart}
      - SOBATPAWS_AI_TEMPERATURE=${SOBATPAWS_AI_TEMPERATURE:-0.2}
      - SOBATPAWS_AI_MAX_TOKENS=${SOBATPAWS_AI_MAX_TOKENS:-800}
      - SOBATPAWS_AI_DAILY_TOKEN_BUDGET=${SOBATPAWS_AI_DAILY_TOKEN_BUDGET:-0}
      - SOBATPAWS_AI_CACHE_TTL_SEC=${SOBATPAWS_AI_CACHE_TTL_SEC:-3600}
      - SOBATPAWS_AI_SKIP_LLM_CONFIDENCE=${SOBATPAWS_AI_SKIP_LLM_CONFIDENCE:-0.82}
      - SOBATPAWS_AI_FALLBACK_CHAIN=${SOBATPAWS_AI_FALLBACK_CHAIN:-local}
      - SOBATPAWS_LEARNING_BACKEND=${SOBATPAWS_LEARNING_BACKEND:-jsonl}
      - SOBATPAWS_AI_STORE_BACKEND=${SOBATPAWS_AI_STORE_BACKEND:-jsonl}
      - SOBATPAWS_SESSION_BACKEND=${SOBATPAWS_SESSION_BACKEND:-jsonl}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-llama3.2}
    volumes:
      # Persistent data: learning store, models, sessions
      - sobatpaws_data:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  sobatpaws_data:
    name: sobatpaws_data
