# A generic, single database configuration.
#
# alembic.ini untuk Sobatpaws PostgreSQL migration
#
# Setup awal:
#   pip install alembic
#   alembic init alembic
#
# Setelah env.py dikonfigurasi:
#   alembic revision --autogenerate -m "initial schema"
#   alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Connection URL diambil dari environment variable DATABASE_URL
# Atau isi di sini secara eksplisit:
# sqlalchemy.url = postgresql://user:***@localhost:5432/sobatpaws
sqlalchemy.url = %(DATABASE_URL)s

[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
